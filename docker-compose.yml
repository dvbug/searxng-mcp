services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_BIND_PORT:-7777}:8080"
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/data:/var/cache/searxng
    networks:
      - mcp-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/search || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  local-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: local-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "17777:8000"
    environment:
      - SEARXNG_API_URL=http://searxng:8080/search
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
      - MCP_LOG_PATH=/logs/mcp_server.log
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_SSE_PATH=${MCP_SSE_PATH:-/sse}
      - MCP_MESSAGE_PATH=${MCP_MESSAGE_PATH:-/messages/}
      - MCP_STREAMABLE_HTTP_PATH=${MCP_STREAMABLE_HTTP_PATH:-/mcp}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
    command:
      - /opt/venv/bin/python
      - /app/mcp-server/main2.py
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --streamable-http-path
      - /mcp
    stdin_open: true
    tty: false
    volumes:
      - ./logs:/logs
    networks:
      - mcp-net
    depends_on:
      searxng:
        condition: service_healthy

networks:
  mcp-net:
    driver: bridge
