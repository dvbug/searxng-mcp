services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_BIND_PORT:-7777}:8080"
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-force-change-me}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/data:/var/cache/searxng
    networks:
      - mcp-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/search || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  local-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: local-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MCP_BIND_HOST:-127.0.0.1}:${MCP_BIND_PORT:-17777}:${MCP_PORT:-8000}"
    environment:
      # 容器内必须使用服务名访问 searxng（覆盖 .env 中的 127.0.0.1）
      - SEARXNG_API_URL=http://searxng:8080/search
      # 容器内日志路径应为绝对路径（覆盖 .env 中的相对路径）
      - MCP_LOG_PATH=/logs/mcp_server.log
      # 代理设置沿用 .env（如需覆盖可在此设置）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
    command: ["/opt/venv/bin/python", "/app/mcp-server/main2.py"]
    volumes:
      - ./logs:/logs
    networks:
      - mcp-net
    depends_on:
      searxng:
        condition: service_healthy
    stdin_open: true
    tty: false

networks:
  mcp-net:
    driver: bridge